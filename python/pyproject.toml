[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-usage-widget"
version = "1.0.0"
description = "macOS desktop widget showing Claude Code and Codex rate-limit usage"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Benoit Pothier" }]
keywords = ["claude", "codex", "macos", "ubersicht", "widget", "rate-limit"]
classifiers = [
    "Environment :: MacOS X",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
ai-usage = "ai_usage_widget.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_usage_widget"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE"]

[tool.mypy]
strict = true
